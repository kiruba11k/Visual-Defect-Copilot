services:
  - type: web
    name: visual-defect-copilot-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: defect-reference-data
      - key: SUPABASE_REFERENCE_CATEGORY
        value: bottle
      - key: CORS_ORIGINS
        value: https://visual-defect-copilot-frontend.onrender.com
      - key: ENABLE_SEMANTIC_RAG
        value: "false"
      - key: DEVICE
        value: cpu

  - type: web
    name: visual-defect-copilot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
